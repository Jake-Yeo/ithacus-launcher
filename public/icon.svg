<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Isle of Ithaca</title>
  <desc id="desc">A modern aerial emblem inspired by the coastline and terrain of Ithaca.</desc>
  <defs>
