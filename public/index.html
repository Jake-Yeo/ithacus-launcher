<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#075f78" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Isle of Ithaca" />
    <link rel="manifest" href="/__ithacus/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/__ithacus/assets/icon-192.png" />
    <link rel="stylesheet" href="/__ithacus/assets/app.css?v=10" />
    <title>Isle of Ithaca</title>
  </head>
  <body>
    <main class="launcher" id="launcher">
      <header class="topbar">
        <div>
          <p class="eyebrow">Isle of Ithaca</p>
          <h1>Your apps</h1>
        </div>
        <div class="connection" aria-label="Tailnet connected">
          <span></span>
          Mac online
        </div>
      </header>

      <section class="overview">
        <div>
          <p class="section-label">Applications</p>
          <h2>Choose an app</h2>
        </div>
        <button class="stop-button" id="stop-button" type="button" hidden>
          Stop current app
        </button>
      </section>

      <section class="app-grid" id="app-grid" aria-live="polite"></section>
      <p class="status-message" id="status-message" role="status"></p>
    </main>

    <section class="app-stage" id="app-stage" hidden>
      <iframe id="app-frame" title="Selected Ithacus application"></iframe>
    </section>

    <script type="module" src="/__ithacus/assets/app.js?v=10"></script>
  </body>
</html>
